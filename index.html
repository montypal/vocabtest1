<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Vocabulary Roots Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .main-wrapper {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 900px;
            align-items: flex-start;
            justify-content: center;
        }
        .quiz-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .word-bank-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 250px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
        }
        h3 {
            margin-top: 0;
            color: #3498db;
            text-align: center;
        }
        .word-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: left;
            font-size: 14px;
        }
        .word-list li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .definition-box {
            font-size: 16px;
            font-style: italic;
            margin: 20px 0;
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #3498db;
            border-radius: 4px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
            min-height: 24px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        #progress {
            margin-top: 5px;
            font-size: 14px;
            color: #7f8c8d;
        }
        #part-info {
            font-weight: bold;
            color: #e67e22;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Word Bank Sidebar -->
    <div class="word-bank-container" id="word-bank-container">
        <h3>Word Bank</h3>
        <ul class="word-list" id="word-list"></ul>
    </div>

    <!-- Quiz Area -->
    <div class="quiz-container">
        <h1>Roots Units 1 & 2 Quiz</h1>
        
        <div id="quiz-area">
            <div id="part-info"></div>
            <div id="progress"></div>
            <div class="definition-box" id="definition-text">Loading...</div>
            <input type="text" id="answer-input" placeholder="Type the word here..." autocomplete="off">
            <br>
            <button id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
            <button id="next-btn" onclick="nextPage()" style="display: none;">Next Page</button>
            <div id="feedback"></div>
        </div>

        <div id="result-area" style="display: none;">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <button onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>
</div>

<script>
    const masterVocabList = [
        // Roots Unit 1
        { word: "Benediction", def: "A prayer asking for God's blessing, especially a prayer that concludes a worship service[cite: 1]" },
        { word: "Benefactor", def: "Someone who helps another person or group, especially by giving money[cite: 1]" },
        { word: "Beneficiary", def: "A person or organization that benefits or is expected to benefit from something, especially one the receives money or property when someone dies[cite: 1]" },
        { word: "Benevolence", def: "Kindness, generosity[cite: 1]" },
        { word: "Amicable", def: "Friendly, peaceful[cite: 1]" },
        { word: "Enamored", def: "Charmed or fascinated, inflamed with love[cite: 1]" },
        { word: "Amorous", def: "Having or showing strong feelings of attraction[cite: 1]" },
        { word: "Paramour", def: "A lover, often secret, not allowed by law or custom[cite: 1]" },
        { word: "Antebellum", def: "Existing before a war, especially before the American Civil War (1861-65)[cite: 1]" },
        { word: "Bellicose", def: "Warlike, aggressive, quarrelsome[cite: 1]" },
        { word: "Belligerence", def: "Aggressiveness, combativeness[cite: 1]" },
        { word: "Rebellion", def: "Open defiance and opposition, sometimes armed, to a person or thing in authority[cite: 1]" },
        { word: "Pacify", def: "To soothe anger or agitation; To subdue by armed action[cite: 1]" },
        { word: "Pacifist", def: "A person opposed to war or violence, especially someone who refuses to bear arms or to fight, on moral or religious grounds[cite: 1]" },
        { word: "Pact", def: "An agreement between two or more people or groups, a treaty or formal agreement between nations to deal with a problem or resolve a dispute[cite: 1]" },
        { word: "Pace", def: "Contrary to the opinions of[cite: 1]" },
        { word: "Criminology", def: "The study of crime, criminals, law enforcement, and punishment[cite: 1]" },
        { word: "Decriminalize", def: "To remove or reduce the criminal status of[cite: 1]" },
        { word: "Incriminate", def: "To show evidence or involvement in a crime[cite: 1]" },
        { word: "Recrimination", def: "An accusation in answer to an accusation made against oneself[cite: 1]" },
        { word: "Approbation", def: "A formal or official act of approving, praise, usually given with pleasure or enthusiasm[cite: 1]" },
        { word: "Probate", def: "The process of proving in court that the will of someone who has died is valid, and of administering the estate of a dead person[cite: 1]" },
        { word: "Probity", def: "Absolute honesty and uprightness[cite: 1]" },
        { word: "Reprobate", def: "A person of thoroughly bad character[cite: 1]" },
        { word: "Grave", def: "Requiring serious thought or concern; Serious and formal in appearance or manner[cite: 1]" },
        { word: "Gravitas", def: "Great or very dignified seriousness[cite: 1]" },
        { word: "Gravitate", def: "To move or be drawn toward something, especially by a natural tendency or as if by an invisible force[cite: 1]" },
        { word: "Aggravate", def: "To make an injury more serious or severe; To annoy or bother[cite: 1]" },
        { word: "Alleviate", def: "To lighten, lessen, or relieve, especially physical or mental suffering[cite: 1]" },
        { word: "Elevation", def: "The height of a place; The act or result of lifting or raising someone or something[cite: 1]" },
        { word: "Cantilever", def: "A long piece of wood, metal, etc that sticks out from a wall to support something above it[cite: 1]" },
        { word: "Levity", def: "Lack of appropriate seriousness[cite: 1]" },
        
        // Roots Unit 2
        { word: "Kleptomania", def: "A mental illness in which a person has a strong desire to steal things[cite: 2]" },
        { word: "Dipsomaniac", def: "A person with an extreme and uncontrollable desire for alcohol[cite: 2]" },
        { word: "Megalomaniac", def: "A mental disorder marked by feelings of great personal power or importance[cite: 2]" },
        { word: "Egomaniac", def: "Someone who is extremely self-centered and ignores the problems and concerns of others[cite: 2]" },
        { word: "Psyche", def: "soul, personality, mind[cite: 2]" },
        { word: "Psychedelic", def: "1. Of or relating to a drug that produces abnormal and often extreme mental effects such as hallucinations. 2. Imitating the effects of psychedelic drugs.[cite: 2]" },
        { word: "Psychosomatic", def: "Caused by mental or emotional problems rather than by physical illness.[cite: 2]" },
        { word: "Psychotherapist", def: "One who treats mental or emotional disorder or related bodily ills by psychological means.[cite: 2]" },
        { word: "Reception", def: "1. The act of receiving 2. A social gathering where guests are formally welcomed.[cite: 2]" },
        { word: "Intercept", def: "To stop, seize, or interrupt (something or someone) before arrival.[cite: 2]" },
        { word: "Perceptible", def: "Noticeable or able to be felt by the senses[cite: 2]" },
        { word: "Susceptible", def: "1. Open to some influence, responsive. 2. Able to be submitted to an action or process.[cite: 2]" },
        { word: "Confine", def: "1. To keep someone or something within limits. 2. To hold someone in a location[cite: 2]" },
        { word: "Definitive", def: "1. Authoritative and final. 2. Specifying perfectly or precisely.[cite: 2]" },
        { word: "Finite", def: "Having definite limits.[cite: 2]" },
        { word: "Infinitesimal", def: "Extremely or immeasurably small.[cite: 2]" },
        { word: "Interject", def: "To interrupt a conversation with a comment or remark[cite: 2]" },
        { word: "Conjecture", def: "To guess[cite: 2]" },
        { word: "Projection", def: "An estimate of what might happen in the future based on what is happening now.[cite: 2]" },
        { word: "Trajectory", def: "The curved path that an object makes in space, or that a thrown object follows as it rises and falls to earth.[cite: 2]" },
        { word: "Traction", def: "The friction that allows a moving thing to move over a surface without slipping[cite: 2]" },
        { word: "Retract", def: "1. To pull back something into something larger. 2. To take back something that has been written.[cite: 2]" },
        { word: "Protracted", def: "Drawn out, continued, extended[cite: 2]" },
        { word: "Intractable", def: "Not easily handled, led, taught, or controlled.[cite: 2]" },
        { word: "Conducive", def: "Tending to promote, encourage, or assist; helpful.[cite: 2]" },
        { word: "Deduction", def: "1. Subtraction. 2. The reaching of a conclusion by reasoning.[cite: 2]" },
        { word: "Induce", def: "1. To persuade, influence. 2. Bring about.[cite: 2]" },
        { word: "Seduction", def: "1. Temptation to sin, especially to engage in sexual intercourse. 2. Attraction or charm.[cite: 2]" },
        { word: "Sequential", def: "1.Arranged in order or in a series. 2. Following in a series.[cite: 2]" },
        { word: "Subsequent", def: "Following in time, order, or place; later[cite: 2]" },
        { word: "Consequential", def: "1. Resulting. 2. Important.[cite: 2]" },
        { word: "Non sequitur", def: "A statement that does not follow logically from anything previously said.[cite: 2]" },
        { word: "Apollonian", def: "Harmonious, ordered, rational, calm[cite: 2]" },
        { word: "Bacchanalian", def: "Frenzied, orgiastic[cite: 2]" },
        { word: "Delphic", def: "Unclear, ambiguous, or confusing[cite: 2]" },
        { word: "Dionysian", def: "Frenzied, delirious[cite: 2]" },
        { word: "Jovial", def: "Jolly, good natured[cite: 2]" },
        { word: "Mercurial", def: "Having rapid and unpredictable changes of mood[cite: 2]" },
        { word: "Olympian", def: "Lofty, superior, and detached[cite: 2]" },
        { word: "Venereal", def: "Having to do with sexual intercourse or diseases transmitted by it.[cite: 2]" }
    ];

    function shuffleArray(array) {
        let newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // Populate Word Bank
    const sortedWords = [...masterVocabList].map(item => item.word).sort((a, b) => a.localeCompare(b));
    const wordListElement = document.getElementById('word-list');
    sortedWords.forEach(w => {
        const li = document.createElement('li');
        li.textContent = w;
        wordListElement.appendChild(li);
    });

    const urlParams = new URLSearchParams(window.location.search);
    let currentPage = parseInt(urlParams.get('q'));
    const totalWords = masterVocabList.length; // 72 words

    if (isNaN(currentPage)) {
        // Create two separate randomized blocks to ensure all 72 are tested in Part 1 and again in Part 2
        const block1 = shuffleArray(masterVocabList);
        const block2 = shuffleArray(masterVocabList);
        const fullQuizList = block1.concat(block2); // 144 questions total
        
        sessionStorage.setItem('vocabQuizList', JSON.stringify(fullQuizList));
        sessionStorage.setItem('vocabScore', '0');
        window.location.href = "?q=0";
    } else {
        runPageLogic();
    }

    function runPageLogic() {
        const activeList = JSON.parse(sessionStorage.getItem('vocabQuizList'));
        
        if (currentPage >= activeList.length) {
            showResults(activeList.length);
            return;
        }

        // Toggle Parts (Part 1: 0-71, Part 2: 72-143)
        if (currentPage < totalWords) {
            document.getElementById('word-bank-container').style.display = 'block';
            document.getElementById('part-info').textContent = 'Part 1: Word Bank Available';
        } else {
            document.getElementById('word-bank-container').style.display = 'none';
            document.getElementById('part-info').textContent = 'Part 2: No Word Bank (Memory Only)';
        }

        document.getElementById("definition-text").textContent = activeList[currentPage].def;
        document.getElementById("progress").textContent = `Question ${currentPage + 1} of ${activeList.length}`;
        
        const answerInput = document.getElementById("answer-input");
        answerInput.focus();
        
        answerInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !answerInput.disabled) {
                event.preventDefault();
                checkAnswer();
            } else if (event.key === "Enter" && answerInput.disabled) {
                event.preventDefault();
                nextPage();
            }
        });
    }

    function checkAnswer() {
        const answerInput = document.getElementById("answer-input");
        const submitBtn = document.getElementById("submit-btn");
        const nextBtn = document.getElementById("next-btn");
        const feedback = document.getElementById("feedback");

        const userAnswer = answerInput.value.trim().toLowerCase();
        const activeList = JSON.parse(sessionStorage.getItem('vocabQuizList'));
        const correctAnswer = activeList[currentPage].word.toLowerCase();

        if (userAnswer === "") return;

        answerInput.disabled = true;
        submitBtn.style.display = "none";
        nextBtn.style.display = "inline-block";
        nextBtn.focus();

        if (userAnswer === correctAnswer) {
            feedback.textContent = "Correct!";
            feedback.className = "correct";
            
            let currentScore = parseInt(sessionStorage.getItem('vocabScore'));
            sessionStorage.setItem('vocabScore', (currentScore + 1).toString());
        } else {
            feedback.innerHTML = `Incorrect. The correct word was: <strong>${activeList[currentPage].word}</strong>`;
            feedback.className = "incorrect";
        }
    }

    function nextPage() {
        window.location.href = `?q=${currentPage + 1}`;
    }

    function showResults(totalQuestions) {
        document.getElementById("quiz-area").style.display = "none";
        document.getElementById("word-bank-container").style.display = "none";
        document.getElementById("result-area").style.display = "block";
        
        const finalScore = sessionStorage.getItem('vocabScore');
        document.getElementById("final-score").textContent = `You scored ${finalScore} out of ${totalQuestions}!`;
    }

    function restartQuiz() {
        sessionStorage.removeItem('vocabQuizList');
        sessionStorage.removeItem('vocabScore');
        window.location.href = window.location.pathname; 
    }
</script>

</body>
</html>
