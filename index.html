<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Roots Quiz - 64 Questions</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .main-wrapper {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 900px;
            align-items: flex-start;
            justify-content: center;
        }
        .quiz-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .word-bank-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 250px;
            max-height: 80vh;
            overflow-y: auto;
            display: none; 
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        h3 {
            margin-top: 0;
            color: #3498db;
            text-align: center;
        }
        .word-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: left;
            font-size: 14px;
        }
        .word-list li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .definition-box {
            font-size: 18px;
            font-style: italic;
            margin: 20px 0;
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #3498db;
            border-radius: 4px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
            min-height: 24px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        #progress {
            margin-top: 5px;
            font-size: 14px;
            color: #7f8c8d;
        }
        #part-info {
            font-weight: bold;
            color: #e67e22;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Word Bank Sidebar -->
    <div class="word-bank-container" id="word-bank-container">
        <h3>Word Bank</h3>
        <ul class="word-list" id="word-list"></ul>
    </div>

    <!-- Quiz Area -->
    <div class="quiz-container">
        <h1>Roots Unit 1 Quiz</h1>
        
        <div id="quiz-area">
            <div id="part-info"></div>
            <div id="progress"></div>
            <div class="definition-box" id="definition-text">Loading...</div>
            <input type="text" id="answer-input" placeholder="Type the word here..." autocomplete="off">
            <br>
            <button id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
            <button id="next-btn" onclick="nextPage()" style="display: none;">Next Page</button>
            <div id="feedback"></div>
        </div>

        <div id="result-area" style="display: none;">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <button onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>
</div>

<script>
    const masterVocabList = [
        { word: "Benediction", def: "A prayer asking for God's blessing, especially a prayer that concludes a worship service" },
        { word: "Benefactor", def: "Someone who helps another person or group, especially by giving money" },
        { word: "Beneficiary", def: "A person or organization that benefits or is expected to benefit from something, especially one the receives money or property when someone dies" },
        { word: "Benevolence", def: "Kindness, generosity" },
        { word: "Amicable", def: "Friendly, peaceful" },
        { word: "Enamored", def: "Charmed or fascinated, inflamed with love" },
        { word: "Amorous", def: "Having or showing strong feelings of attraction" },
        { word: "Paramour", def: "A lover, often secret, not allowed by law or custom" },
        { word: "Antebellum", def: "Existing before a war, especially before the American Civil War (1861-65)" },
        { word: "Bellicose", def: "Warlike, aggressive, quarrelsome" },
        { word: "Belligerence", def: "Aggressiveness, combativeness" },
        { word: "Rebellion", def: "Open defiance and opposition, sometimes armed, to a person or thing in authority" },
        { word: "Pacify", def: "To soothe anger or agitation; To subdue by armed action" },
        { word: "Pacifist", def: "A person opposed to war or violence, especially someone who refuses to bear arms or to fight, on moral or religious grounds" },
        { word: "Pact", def: "An agreement between two or more people or groups, a treaty or formal agreement between nations to deal with a problem or resolve a dispute" },
        { word: "Pace", def: "Contrary to the opinions of" },
        { word: "Criminology", def: "The study of crime, criminals, law enforcement, and punishment" },
        { word: "Decriminalize", def: "To remove or reduce the criminal status of" },
        { word: "Incriminate", def: "To show evidence or involvement in a crime" },
        { word: "Recrimination", def: "An accusation in answer to an accusation made against oneself" },
        { word: "Approbation", def: "A formal or official act of approving, praise, usually given with pleasure or enthusiasm" },
        { word: "Probate", def: "The process of proving in court that the will of someone who has died is valid, and of administering the estate of a dead person" },
        { word: "Probity", def: "Absolute honesty and uprightness" },
        { word: "Reprobate", def: "A person of thoroughly bad character" },
        { word: "Grave", def: "Requiring serious thought or concern; Serious and formal in appearance or manner" },
        { word: "Gravitas", def: "Great or very dignified seriousness" },
        { word: "Gravitate", def: "To move or be drawn toward something, especially by a natural tendency or as if by an invisible force" },
        { word: "Aggravate", def: "To make an injury more serious or severe; To annoy or bother" },
        { word: "Alleviate", def: "To lighten, lessen, or relieve, especially physical or mental suffering" },
        { word: "Elevation", def: "The height of a place; The act or result of lifting or raising someone or something" },
        { word: "Cantilever", def: "A long piece of wood, metal, etc that sticks out from a wall to support something above it" },
        { word: "Levity", def: "Lack of appropriate seriousness" }
    ];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Populate Word Bank
    const sortedWords = [...masterVocabList].map(item => item.word).sort();
    const wordListElement = document.getElementById('word-list');
    sortedWords.forEach(w => {
        const li = document.createElement('li');
        li.textContent = w;
        wordListElement.appendChild(li);
    });

    const urlParams = new URLSearchParams(window.location.search);
    let currentPage = parseInt(urlParams.get('q'));

    if (isNaN(currentPage)) {
        // Create 64 questions: Two full shuffled sets of the 32 words
        const part1 = shuffleArray([...masterVocabList]);
        const part2 = shuffleArray([...masterVocabList]);
        const combinedList = part1.concat(part2);
        
        sessionStorage.setItem('vocabQuizList', JSON.stringify(combinedList));
        sessionStorage.setItem('vocabScore', '0');
        window.location.href = "?q=0";
    } else {
        runPageLogic();
    }

    function runPageLogic() {
        const activeList = JSON.parse(sessionStorage.getItem('vocabQuizList'));
        
        if (currentPage >= activeList.length) {
            showResults(activeList.length);
            return;
        }

        // Toggle Parts (Part 1: 0-31, Part 2: 32-63)
        if (currentPage < 32) {
            document.getElementById('word-bank-container').style.display = 'block';
            document.getElementById('part-info').textContent = 'Part 1: Word Bank Available';
        } else {
            document.getElementById('word-bank-container').style.display = 'none';
            document.getElementById('part-info').textContent = 'Part 2: No Word Bank (Memory Only)';
        }

        document.getElementById("definition-text").textContent = activeList[currentPage].def;
        document.getElementById("progress").textContent = `Question ${currentPage + 1} of ${activeList.length}`;
        
        const answerInput = document.getElementById("answer-input");
        answerInput.focus();
        
        answerInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !answerInput.disabled) {
                event.preventDefault();
                checkAnswer();
            } else if (event.key === "Enter" && answerInput.disabled) {
                event.preventDefault();
                nextPage();
            }
        });
    }

    function checkAnswer() {
        const answerInput = document.getElementById("answer-input");
        const submitBtn = document.getElementById("submit-btn");
        const nextBtn = document.getElementById("next-btn");
        const feedback = document.getElementById("feedback");

        const userAnswer = answerInput.value.trim().toLowerCase();
        const activeList = JSON.parse(sessionStorage.getItem('vocabQuizList'));
        const correctAnswer = activeList[currentPage].word.toLowerCase();

        if (userAnswer === "") return;

        answerInput.disabled = true;
        submitBtn.style.display = "none";
        nextBtn.style.display = "inline-block";
        nextBtn.focus();

        if (userAnswer === correctAnswer) {
            feedback.textContent = "Correct!";
            feedback.className = "correct";
            
            let currentScore = parseInt(sessionStorage.getItem('vocabScore'));
            sessionStorage.setItem('vocabScore', (currentScore + 1).toString());
        } else {
            feedback.innerHTML = `Incorrect. The correct word was: <strong>${activeList[currentPage].word}</strong>`;
            feedback.className = "incorrect";
        }
    }

    function nextPage() {
        window.location.href = `?q=${currentPage + 1}`;
    }

    function showResults(totalQuestions) {
        document.getElementById("quiz-area").style.display = "none";
        document.getElementById("word-bank-container").style.display = "none";
        document.getElementById("result-area").style.display = "block";
        
        const finalScore = sessionStorage.getItem('vocabScore');
        document.getElementById("final-score").textContent = `You scored ${finalScore} out of ${totalQuestions}!`;
    }

    function restartQuiz() {
        sessionStorage.removeItem('vocabQuizList');
        sessionStorage.removeItem('vocabScore');
        window.location.href = window.location.pathname; 
    }
</script>

</body>
</html>
